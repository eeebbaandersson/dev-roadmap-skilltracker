<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevRoadmap | Sign In</title>
    <link rel="stylesheet" href="../../static/css/login-signup.css" th:href="@{/css/login-signup.css}">
    <link rel="stylesheet" href="../../static/css/decorations.css" th:href="@{/css/decorations.css}">


</head>
<body class="auth-body">
<div th:replace="~{skills/fragments/decorations :: code-background}"></div>

<div th:replace="~{skills/fragments/foreground-code :: foreground-layers}"></div>

<div class="container">
    <header>
        <h1>Welcome Back!</h1>
        <p>Pick up right where you left off.</p>

    </header>

    <div th:if="${param.error}" class="alert-error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="alert-success">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>

        <p class="signup-link">
            Don't have an account? <a th:href="@{/signup}">Sign up</a>
        </p>
    </form>

    <span class="rocket-icon"></span>
</div>

</body>
</html>
