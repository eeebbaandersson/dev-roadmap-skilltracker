<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../static/css/login-signup.css" th:href="@{/css/login-signup.css}">
    <link rel="stylesheet" href="../static/css/decorations.css" th:href="@{/css/decorations.css}">


</head>
<body class="auth-body">
<div th:replace="~{skills/fragments/decorations :: code-background}"></div>

<div th:replace="~{skills/fragments/foreground-code :: foreground-layers}"></div>

<div class="container">
    <header>
        <h1>Create an account</h1>

    </header>

    <div th:if="${param.error}" class="alert-error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="alert-success">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Select username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Select password" required>
        </div>

        <button type="submit" class="btn-submit">Sign Up</button>

        <p class="signup-link">
            Already have an account? <a th:href="@{/login}">Login</a>
        </p>

    </form>

</div>

</body>
</html>
